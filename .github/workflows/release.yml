name: Publish to PyPI

on:
  release:
    types: [published]
  # Manual runs validate the package without publishing it.
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/release.yml]
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build source distribution and wheel
        run: python -m build --outdir dist python3
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Check package identity and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.utils import parse_sdist_filename, parse_wheel_filename

          wheels = list(Path('dist').glob('*.whl'))
          sdists = list(Path('dist').glob('*.tar.gz'))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit('Expected exactly one wheel and one source distribution')
          name, version, _, _ = parse_wheel_filename(wheels[0].name)
          if name != 'i2cdriver' or parse_sdist_filename(sdists[0].name) != (name, version):
              raise SystemExit('Distribution names or versions do not match')
          tag = os.environ['RELEASE_TAG']
          if tag and tag not in (str(version), f'v{version}'):
              raise SystemExit(f'Release tag {tag!r} does not match package version {version}')
          print(f'Checked {name} {version}')
          PY
      - name: Install built wheel
        run: python -m pip install dist/*.whl
      - name: Test installed wheel without hardware
        run: |
          cd "$RUNNER_TEMP"
          python -c 'from i2cdriver import I2CDriver; import EDS'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish with attestations
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/i2cdriver/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
